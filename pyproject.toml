[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hadro"
dynamic = ["version"]
description = "A small, read-only, S3-compatible server for local directories and Google Cloud Storage, with S3 Select over Parquet, JSON Lines and CSV."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Justin Joyce" }]
keywords = ["s3", "emulator", "s3-select", "parquet", "gcs", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.30,<1.0",
    "rugo>=0.4.41",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.10,<4.0"]
test = [
    "pytest>=7.0,<10.0",
    "httpx>=0.24,<1.0",
    "boto3>=1.34",
    "minio>=7.2,<8.0",
    "requests>=2.31",
]

[project.scripts]
hadro = "hadro.cli:main"

[project.urls]
Source = "https://github.com/mabel-dev/hadro"

[tool.setuptools.dynamic]
version = { attr = "hadro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
